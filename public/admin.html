<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Заявки | Hayanmi Detailing</title>
  <link rel="icon" href="/favicon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Unbounded:wght@300;500&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="wrap admin">
    <p class="eyebrow">Hayanmi Detailing</p>
    <h1 class="display h2" style="margin-top:12px">Заявки</h1>

    <p class="mute" id="state" style="margin-top:24px">Загружаем...</p>

    <section id="board" hidden>
      <div class="filters" id="filters">
        <button type="button" class="chip" data-f="active" aria-pressed="true">В работе</button>
        <button type="button" class="chip" data-f="all" aria-pressed="false">Все</button>
        <button type="button" class="chip" data-f="done" aria-pressed="false">Выполнено</button>
      </div>
      <p class="mute small" id="count" style="margin-top:16px"></p>
      <div class="leads" id="leads"></div>
    </section>
  </main>
  <script src="/admin.js" defer></script>
</body>
</html>
